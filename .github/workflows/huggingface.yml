# Publishes the web demo (Space) and the benchmark dataset to Hugging Face on
# every push to main. Needs a repository secret named HF_TOKEN: see
# docs/HUGGINGFACE.md. Without it the job is skipped, so CI stays green.
name: Publish to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Only a yes/no is exposed here; the token itself goes to the one step that needs it.
      HAS_HF_TOKEN: ${{ secrets.HF_TOKEN != '' }}
    steps:
      - name: Skip when HF_TOKEN isn't set
        if: env.HAS_HF_TOKEN != 'true'
        run: echo "::notice title=Hugging Face::HF_TOKEN secret not set, so nothing was published. See docs/HUGGINGFACE.md."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: env.HAS_HF_TOKEN == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: env.HAS_HF_TOKEN == 'true'
        with:
          python-version: "3.12"

      - name: Check the benchmark before publishing it
        if: env.HAS_HF_TOKEN == 'true'
        run: python benchmark/run.py --check

      - name: Build Space and dataset folders
        if: env.HAS_HF_TOKEN == 'true'
        run: python tools/build_hf.py build/hf

      - name: Install the Hugging Face client
        if: env.HAS_HF_TOKEN == 'true'
        run: python -m pip install --quiet "huggingface_hub==2.2.0"

      - name: Publish
        if: env.HAS_HF_TOKEN == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/publish_hf.py build/hf
