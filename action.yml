name: "AI Security Atlas"
description: "Lightweight scan for selected AI-era risks: insecure code patterns, exposed credentials, risky AI-agent configs, suspicious dependencies, hidden Unicode and crypto migration signals."
author: "kaymyg"
branding:
  icon: "shield"
  color: "purple"

# Every input is passed through an environment variable, validated, and
# handed to the CLI as a separate argument. Nothing is pasted into the shell.

inputs:
  path:
    description: "Folder to scan, relative to the repository root"
    default: "."
  fail-on:
    description: "Fail on findings at or above: critical, high, medium, low, info, never"
    default: "high"
  min-severity:
    description: "Hide findings below: critical, high, medium, low, info"
    default: "low"
  only:
    description: "Comma-separated categories to run (vibe-code,secrets,agents,supply-chain,quantum). Empty = all"
    default: ""
  exclude:
    description: "Glob patterns to skip, one per line"
    default: ""
  online:
    description: "Check PyPI/npm for missing or brand-new packages: true or false"
    default: "true"
  upload-sarif:
    description: "Upload results to the Security tab (needs `security-events: write`): true or false"
    default: "true"

outputs:
  sarif-file:
    description: "Path to the SARIF report"
    value: ${{ steps.scan.outputs.sarif }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Install ai-security-atlas
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"

    - name: Scan
      id: scan
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_MIN: ${{ inputs.min-severity }}
        IN_ONLY: ${{ inputs.only }}
        IN_EXCLUDE: ${{ inputs.exclude }}
        IN_ONLINE: ${{ inputs.online }}
      run: |
        set -euo pipefail
        fail() { echo "::error title=ai-security-atlas::$1"; exit 2; }

        case "$IN_FAIL_ON" in critical|high|medium|low|info|never) ;; *) fail "fail-on must be critical, high, medium, low, info or never (got '$IN_FAIL_ON')";; esac
        case "$IN_MIN" in critical|high|medium|low|info) ;; *) fail "min-severity must be critical, high, medium, low or info (got '$IN_MIN')";; esac
        case "$IN_ONLINE" in true|false) ;; *) fail "online must be true or false (got '$IN_ONLINE')";; esac
        [[ "$IN_ONLY" =~ ^[a-z,-]*$ ]] || fail "only may contain category names and commas"
        [[ "$IN_PATH" != -* ]] || fail "path must not start with '-'"
        [ -e "$IN_PATH" ] || fail "path not found: $IN_PATH"

        args=(--min-severity "$IN_MIN")
        if [ "$IN_ONLINE" = "true" ]; then args+=(--online); fi
        if [ -n "$IN_ONLY" ]; then args+=(--only "$IN_ONLY"); fi
        while IFS= read -r pattern; do
          pattern="${pattern#"${pattern%%[![:space:]]*}"}"; pattern="${pattern%"${pattern##*[![:space:]]}"}"
          [ -n "$pattern" ] && args+=(--exclude "$pattern")
        done <<< "$IN_EXCLUDE"

        sarif="$RUNNER_TEMP/atlas.sarif"
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        # One report for the Security tab, one for the job summary; the final
        # text run decides pass/fail.
        atlas scan "${args[@]}" --fail-on never -f sarif -o "$sarif" -- "$IN_PATH"
        atlas scan "${args[@]}" --fail-on never -f markdown -- "$IN_PATH" >> "$GITHUB_STEP_SUMMARY"
        atlas scan "${args[@]}" --fail-on "$IN_FAIL_ON" -- "$IN_PATH"

    - name: Upload SARIF
      # Pull requests from forks get a read-only token and can't upload, so skip those.
      if: >-
        always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif != '' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b  # v3.38.3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: ai-security-atlas
